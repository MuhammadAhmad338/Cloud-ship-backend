services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloudship
      POSTGRES_USER: cloudship
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell or .env}
    ports:
      - "5432:5432"
    volumes:
      - cloudship_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudship -d cloudship"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cloudship_postgres_data: